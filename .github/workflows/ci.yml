name: UI foundation checks
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
  connector-smoke:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --dir apps/web test:e2e connector-hub.spec.ts --grep 'connector smoke' --workers=2
        env:
          PLAYWRIGHT_PRODUCTION: '1'
          PLAYWRIGHT_PORT: '3106'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-smoke-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
            artifacts/phase2/screenshots
